services:
  remnawave-subscription-page:
    image: remnawave/subscription-page:latest
    container_name: remnawave-subscription-page
    hostname: remnawave-subscription-page
    restart: always
    # Лимиты подставляет установщик от объёма RAM хоста.
    mem_limit: $MEM_SUB
    memswap_limit: $MEMSWAP_SUB
    env_file:
      - .env
    ports:
      - 127.0.0.1:$SUB_PORT:$SUB_PORT
    networks:
      - remnawave-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  remnawave-network:
    driver: bridge
    external: true
